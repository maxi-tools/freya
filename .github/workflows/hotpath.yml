name: Hotpath

on:
  pull_request:

permissions: {}

jobs:
  hotpath:
    runs-on: [self-hosted, Linux, ARM64]
    concurrency:
      group: hotpath-${{ github.ref_name }}
      cancel-in-progress: true
    permissions:
      pull-requests: write
      contents: read
    steps:
      # Fleet trust gate (maxi-config#1019, from maxi-core#4875): untrusted senders
      # fail fast BEFORE checkout -- this repository is public and the org's `Default`
      # runner group admits public repositories. First step, never a job-level `if`.
      # Admitted: push, schedule, merge_group/checks_requested, Dependabot (by actor),
      # and workflow_dispatch / same-repo pull_request from senders 874012 or
      # 264883562 only.
      - name: trust gate
        if: ${{ github.actor != 'dependabot[bot]' && !(github.event_name == 'push' || github.event_name == 'schedule' || ((github.event.sender.id == 874012 || github.event.sender.id == 264883562) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) || (github.event_name == 'merge_group' && github.event.action == 'checks_requested')) }}
        env:
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          echo "::error::Untrusted sender (${SENDER_LOGIN}): this job only runs code pushed by trusted senders on self-hosted runners. Push a commit as a trusted sender or re-run via workflow_dispatch."
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true
      - uses: dtolnay/rust-toolchain@1.94
      - name: Install just
        uses: taiki-e/install-action@just
      # `$CARGO_HOME/bin` on PATH, because nothing else puts it there. A
      # GitHub-hosted image ships `~/.cargo/bin` already on PATH, so
      # `cargo install`ing a standalone binary and then calling it by name
      # just works; on these boxes CARGO_HOME is `/data/ci/<runner>/.cargo`
      # and it does not. The job profiled both revisions in both modes and
      # then died on the last two steps with
      #
      #   hotpath-utils: command not found     (exit 127)
      #
      # -- all four measurements taken, none reported. cargo subcommands are
      # unaffected (cargo finds its own bin dir), which is why
      # `cargo install cargo-ndk` elsewhere never showed this.
      - name: Install hotpath-utils CLI
        run: |
          set -euo pipefail
          cargo install hotpath --version '^0.14' --bin hotpath-utils --features=utils
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2
        if: github.ref != 'refs/heads/main'
        with:
          shared-key: "rust-ubuntu-latest"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-system-deps
      - name: Create metrics directory
        run: mkdir -p /tmp/metrics
      - name: Head timing metrics
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/head_timing.json
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          just ps-ci
      - name: Base timing metrics
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/base_timing.json
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          just ps-ci
      - name: Head alloc metrics
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/head_alloc.json
        run: |
          git checkout ${{ github.event.pull_request.head.sha }}
          just pa-ci
      - name: Base alloc metrics
        env:
          HOTPATH_OUTPUT_FORMAT: json
          HOTPATH_OUTPUT_PATH: /tmp/metrics/base_alloc.json
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          just pa-ci
      - name: Post PR comment - alloc mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hotpath-utils profile-pr \
            --head-metrics /tmp/metrics/head_alloc.json \
            --base-metrics /tmp/metrics/base_alloc.json \
            --pr-number '${{ github.event.pull_request.number }}' \
            --benchmark-id "alloc" \
            --github-token "$GH_TOKEN"

      - name: Post PR comment - timing mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          hotpath-utils profile-pr \
            --head-metrics /tmp/metrics/head_timing.json \
            --base-metrics /tmp/metrics/base_timing.json \
            --pr-number '${{ github.event.pull_request.number }}' \
            --benchmark-id "timing" \
            --github-token "$GH_TOKEN"
