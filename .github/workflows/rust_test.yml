name: Rust Test

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    # `join(matrix.os, '-')`, NOT `matrix.os`. Upstream's matrix was
    # `[ubuntu-latest, windows-latest, macos-latest]` -- plain strings, one
    # distinct group each. This fork's matrix legs are LABEL ARRAYS, and an
    # array interpolated into a string contributes nothing, so all three legs
    # resolved to the single group `rust-test--main` and `cancel-in-progress`
    # made each leg kill the two still waiting for a runner.
    #
    # Measured on eight consecutive runs before this change: exactly one leg
    # of three ever ran, the other two were `cancelled` with zero steps and a
    # one-second duration, and WHICH leg survived varied run to run. That is
    # why `build (self-hosted, Linux, ARM64)` and
    # `build (self-hosted, Windows, X64)` read as permanently failing on main
    # while `build (self-hosted, macOS, ARM64)` read as green -- nothing was
    # wrong with those two legs at the point they were killed; they simply
    # lost the race to the leg that got a runner first.
    concurrency:
      group: rust-test-${{ join(matrix.os, '-') }}-${{ github.ref_name }}
      cancel-in-progress: true
    strategy:
      matrix:
        os:
          - [self-hosted, Linux, ARM64]
          - [self-hosted, Windows, X64]
          - [self-hosted, macOS, ARM64]

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2
        submodules: true
    - name: Install stable rust toolchain
      uses: dtolnay/rust-toolchain@1.94
    - name: Install nextest
      uses: taiki-e/install-action@nextest
    - name: Install just
      uses: taiki-e/install-action@just
    - name: Set up cargo cache
      uses: Swatinem/rust-cache@v2
      if: github.ref != 'refs/heads/main'
      with:
        # Same array-interpolation bug as the concurrency group above: with
        # `matrix.os` the three legs shared the key "rust-", so a Windows job
        # could restore a macOS cache.
        shared-key: "rust-${{ join(matrix.os, '-') }}"
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Install linux dependencies
      if: runner.os == 'Linux'
      uses: ./.github/actions/linux-system-deps
    - name: Remove unused programs in linux
      if: runner.os == 'Linux'
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - name: Run Linux tests
      if: runner.os == 'Linux'
      run: |
        export RUSTFLAGS="-Cinstrument-coverage"
        export RUSTDOCFLAGS="-Cinstrument-coverage"
        export LLVM_PROFILE_FILE='cargo-test-%p-%m.profraw'
        just t
    - name: Run MacOS and Windows tests
      if: runner.os != 'Linux'
      run: just t
    - name: Run coverage
      if: runner.os == 'Linux'
      run: |
        rustup component add llvm-tools-preview
        curl -L https://github.com/mozilla/grcov/releases/latest/download/grcov-x86_64-unknown-linux-gnu.tar.bz2 | tar jxf -
        ./grcov . --binary-path ./target/debug/deps -s . -t lcov --branch --ignore-not-existing --ignore "../*" --ignore "/*" -o cov.lcov
    - uses: codecov/codecov-action@v6
      if: runner.os == 'Linux'
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
