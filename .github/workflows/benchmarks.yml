on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/torin/**/*'
      - '.github/workflows/benchmarks.yml'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'

name: Run Benchmarks
permissions:
  contents: read
  pull-requests: write

jobs:
  runBenchmark:
    name: run benchmark
    runs-on: [self-hosted, Linux, ARM64]
    concurrency:
      group: benchmarks-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      # The fleet trust gate, copied from maxi-config#1019 (itself ported from
      # maxi-core#4875): untrusted senders fail fast BEFORE checkout. This repository
      # is PUBLIC and the org's `Default` runner group admits public repositories, so
      # a fork pull request would otherwise reach these self-hosted machines with
      # PR-authored code; the repo's all_external_contributors approval policy is the
      # only other barrier and is not a code-level one. The gate is the FIRST step,
      # never a job-level `if`: a job-level guard guards the workflow file as committed
      # to the base branch, while a first step runs even when a pull request rewrites
      # this file (GitHub runs the workflow from the PR's merge commit).
      #
      # Admitted: push and schedule (organisational events, post-merge code);
      # workflow_dispatch and same-repository pull requests only from trusted senders
      # 874012 (maxiboch) and 264883562 (maxi-tools-auth[bot]); and
      # merge_group/checks_requested (GitHub assembled the ref from PRs already
      # admitted to the queue). Dependabot is admitted by actor name, the same
      # exemption the runner-routing fallbacks use.
      - name: trust gate
        if: ${{ github.actor != 'dependabot[bot]' && !(github.event_name == 'push' || github.event_name == 'schedule' || ((github.event.sender.id == 874012 || github.event.sender.id == 264883562) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))) || (github.event_name == 'merge_group' && github.event.action == 'checks_requested')) }}
        env:
          SENDER_LOGIN: ${{ github.event.sender.login }}
        run: |
          echo "::error::Untrusted sender (${{SENDER_LOGIN}}): this job only runs code pushed by trusted senders on self-hosted runners. Push a commit as a trusted sender or re-run via workflow_dispatch."
          exit 1

      - uses: actions/checkout@v6
        with:
          submodules: true
      # Second instance of the same gap `hotpath.yml` hit, and this one cannot
      # be fixed inside the step that causes it: criterion-compare runs
      # `cargo install critcmp` itself and then calls `critcmp` by name. A
      # GitHub-hosted image has `~/.cargo/bin` on PATH; these boxes set
      # CARGO_HOME to `/data/ci/<runner>/.cargo` and nothing adds its bin dir,
      # so the action installs the tool successfully and then cannot find it:
      #
      #   Error: Unable to locate executable file: critcmp.
      #
      # Doing it here rather than vendoring a fork of the action. Tracked
      # fleet-side as maxi-config#662.
      - name: Put cargo's bin directory on PATH
        run: echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"

      - uses: boa-dev/criterion-compare-action@59f4d964c5f19d7f13d36f5c0944b18ce6652cb0
        with:
          package: torin
          branchName: ${{ github.base_ref }}
          token: ${{ github.token }}
