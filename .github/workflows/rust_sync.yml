name: Rust Skia bindings sync

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  skia-bindings-sync:
    runs-on: [self-hosted, Linux, ARM64]
    concurrency:
      group: rust-sync-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: true
      - name: Install stable rust toolchain
        uses: dtolnay/rust-toolchain@1.94
      - name: Install linux dependencies
        uses: ./.github/actions/linux-system-deps
      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2
        if: github.ref != 'refs/heads/main'
        with:
          # There is no matrix in this job. `${{ matrix.os }}` was copied in
          # from rust_test.yml and resolved to nothing, so the key was the
          # bare "rust-", shared with any other job that made the same
          # mistake.
          shared-key: "rust-skia-sync-linux-arm64"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Make sure the mocked Skia bindings are on sync
        run: cargo build --package freya --package freya-testing --features "mocked-engine, all-bindings" --no-default-features
