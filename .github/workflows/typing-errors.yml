name: Typing errors

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  spelling:
    runs-on: [self-hosted, Linux, ARM64]
    steps:
      - uses: actions/checkout@v6
      - name: Spell check with typos
        uses: crate-ci/typos@v1.42.0
        with:
          isolated: true
          config: ./_typos.toml
          files: .
