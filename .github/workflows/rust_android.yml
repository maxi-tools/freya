name: Rust Android Build

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  android:
    # macOS, not `[self-hosted, Linux, ARM64]`, and not by preference.
    #
    # Google publishes the Linux NDK for x86_64 hosts ONLY -- r26d has no
    # `linux-aarch64` prebuilt -- so on the DGX boxes this job unpacked an NDK
    # whose entire toolchain directory was for the wrong architecture. The
    # guard added below said so in one line on pearl-1:
    #
    #   The NDK host toolchain will not execute on pearl-1 (aarch64);
    #   NDK r26d is built for linux-x86_64 hosts only.
    #
    # `[self-hosted, Linux, X64]` is not the answer either: those are the
    # NixOS boxes, and the NDK's prebuilt binaries are dynamically linked
    # against an FHS loader that does not exist there.
    #
    # The macOS NDK does run, and natively -- probed on maxibookpro26b (run
    # 34665918882): r26d's `darwin-x86_64/bin/clang` is a Mach-O UNIVERSAL
    # binary carrying both x86_64 and arm64 slices, and `clang --version`
    # exits 0 on Apple Silicon without Rosetta. The host tag says darwin-x86_64
    # because that is the directory Google ships it under; it is not a
    # statement about the CPU.
    runs-on: [self-hosted, macOS, ARM64]
    concurrency:
      group: rust-android-${{ github.ref_name }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
          submodules: true
      # `$RUNNER_TEMP`, not `/home/runner`. That path is a GitHub-HOSTED
      # runner's home directory; it came along with the rest of this file when
      # the job moved to the fleet and nothing on a self-hosted box guarantees
      # it. On the DGX boxes the runner's home is `/data/ci/<runner>`, and the
      # job died at
      #
      #   checkdir: cannot create extraction directory: /home/runner
      #
      # before the NDK was ever unpacked. ANDROID_NDK_HOME/ANDROID_NDK move
      # out of the workflow-level `env:` for the same reason: that block is
      # evaluated before any runner context exists, so it cannot name a path
      # that depends on which box took the job.
      - name: Install NDK r26d
        run: |
          set -euo pipefail
          ndk_parent="$RUNNER_TEMP/android-ndk"
          rm -rf "$ndk_parent"
          mkdir -p "$ndk_parent"
          curl -sSfL -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r26d-darwin.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$ndk_parent"
          rm "$RUNNER_TEMP/ndk.zip"
          echo "ANDROID_NDK_HOME=$ndk_parent/android-ndk-r26d" >> "$GITHUB_ENV"
          echo "ANDROID_NDK=$ndk_parent/android-ndk-r26d" >> "$GITHUB_ENV"

      # Kept after the move, because the move is exactly what it is for: the
      # NDK is downloaded for one host tag and the lane is chosen separately,
      # so the two can drift apart again. One second here turns "this lane
      # cannot run this job" into one line, instead of an exec-format error
      # surfacing from inside cargo-ndk after minutes of compiling.
      - name: Verify the NDK host toolchain runs here
        run: |
          set -euo pipefail
          host_tag="$([ "$RUNNER_OS" = "macOS" ] && echo darwin-x86_64 || echo linux-x86_64)"
          clang="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/$host_tag/bin/clang"
          if [ ! -x "$clang" ]; then
            echo "::error::NDK r26d ships no $host_tag toolchain in this archive ($clang absent)."
            exit 1
          fi
          if ! "$clang" --version >/dev/null 2>&1; then
            echo "::error::The NDK $host_tag toolchain will not execute on ${RUNNER_NAME:-this runner} ($(uname -m)). Google ships no linux-aarch64 NDK, so this lane cannot host the Android build."
            exit 1
          fi
      - name: Install stable rust toolchain
        uses: dtolnay/rust-toolchain@1.94
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk
      - name: Set up cargo cache
        uses: Swatinem/rust-cache@v2
        if: github.ref != 'refs/heads/main'
        with:
          shared-key: "rust-android"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build Android example
        run: cargo ndk -t arm64-v8a build -p android --lib
