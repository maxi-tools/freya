name: Rust Lint

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  lint-linux:
    runs-on: [self-hosted, Linux, ARM64]
    concurrency:
      group: rust-lint-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2
        submodules: true
    - name: Install linux dependencies
      run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config libglib2.0-dev libgtk-3-dev libudev-dev libxdo-dev libwebkit2gtk-4.1-dev
    - name: Install stable rust toolchain
      uses: dtolnay/rust-toolchain@1.94
      with:
        components: rustfmt, clippy
    - name: Install nightly rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-03-15
        components: rustfmt
    - name: Install just
      uses: taiki-e/install-action@just
    - name: Install taplo
      uses: taiki-e/install-action@taplo
    - name: Set up cargo cache
      uses: Swatinem/rust-cache@v2
      if: github.ref != 'refs/heads/main'
      with:
        shared-key: "rust-ubuntu-latest"
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Lint
      run: just c-ci
    - name: Format
      run: just f-check

  lint-macos:
    runs-on: [self-hosted, macOS, ARM64]
    concurrency:
      group: rust-lint-macos-${{ github.ref_name }}
      cancel-in-progress: true

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 2
        submodules: true
    - name: Install stable rust toolchain
      uses: dtolnay/rust-toolchain@1.94
      with:
        components: rustfmt, clippy
    - name: Install nightly rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly-2026-03-15
        components: rustfmt
    - name: Install just
      uses: taiki-e/install-action@just
    - name: Install taplo
      uses: taiki-e/install-action@taplo
    - name: Set up cargo cache
      uses: Swatinem/rust-cache@v2
      if: github.ref != 'refs/heads/main'
      with:
        shared-key: "rust-macos-latest"
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Lint
      run: just c-ci
    - name: Format
      run: just f-check
