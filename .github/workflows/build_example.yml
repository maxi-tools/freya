name: Build example

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS"
        required: true
        type: choice
        # JSON strings, not YAML sequences. A `workflow_dispatch` choice
        # option must be a scalar, so the three label arrays this file grew
        # during the move to self-hosted runners each collapsed to the empty
        # string -- an input offering the same blank option three times, and
        # a `runs-on` that selected nothing. `fromJSON` below turns the
        # chosen string back into the label list.
        options:
          - '["self-hosted", "macOS", "ARM64"]'
          - '["self-hosted", "Linux", "ARM64"]'
          - '["self-hosted", "Windows", "X64"]'
      example_name:
        description: "Example name"
        required: true

permissions:
  contents: read

jobs:
  build:
    # A one-entry matrix existed only to smuggle the input into `runs-on`,
    # which can read `inputs` directly on a workflow_dispatch.
    runs-on: ${{ fromJSON(inputs.os) }}

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install linux dependencies
        if: runner.os == 'Linux'
        uses: ./.github/actions/linux-system-deps

      - name: Build example
        run: cargo build --example ${{inputs.example_name}} --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: target/release/examples/*
