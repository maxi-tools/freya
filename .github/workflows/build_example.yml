name: Build example

on:
  workflow_dispatch:
    inputs:
      os:
        description: "OS"
        required: true
        type: choice
        options:
          - [self-hosted, macOS, ARM64]
          - [self-hosted, Linux, ARM64]
          - [self-hosted, Windows, X64]
      example_name:
        description: "Example name"
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    if: ${{ always() }}
    strategy:
      matrix:
        os: ["${{ inputs.os }}"]
      fail-fast: true

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Install linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libssl-dev pkg-config libglib2.0-dev libgtk-3-dev libudev-dev libxdo-dev libwebkit2gtk-4.1-dev

      - name: Build example
        run: cargo build --example ${{inputs.example_name}} --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: target/release/examples/*
