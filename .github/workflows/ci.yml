# maxi-config-owned standard Rust CI wrapper.
# Thin standard Rust CI wrapper for maxi-tools repos.
# Source of truth: maxi-config/.github/workflows/rust-ci.yml
# Copy to .github/workflows/ci.yml in simple Rust repos that can use the
# canonical lane policy without repo-local CI customization.
# Fanned out by scripts/sync-maxi-review.sh; edit it there, not here.

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || contains(fromJSON('["run-ci","run-clippy"]'), github.event.label.name)) }}

on:
  push:
    branches: [main, release/**]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions: {}

jobs:
  merge-gate:
    # The PUBLIC mirror, pinned. freya is a public repository and
    # maxi-tools/maxi-config is private; GitHub will not resolve a `uses:`
    # from a public repo into a private one. The call simply fails to start:
    # the run ends in ~1s with ZERO jobs, no logs, and nothing to re-run
    # (`gh run rerun` answers "This workflow run cannot be retried").
    #
    # It is worse than an ordinary red, because GitHub reads a workflow's
    # `name:` from the default branch and falls back to the PATH when it
    # cannot resolve the file. This workflow was registered as
    # `.github/workflows/ci.yml` rather than `CI`, which is the visible tell
    # that it had never started successfully -- see the API, where `name`
    # equals `path`.
    #
    # maxi-tools/ci exists precisely for this: it is the public mirror of
    # maxi-config's lane workflows. The SHA is ci main at e8a4eec (ci#55),
    # which carries repo_policy: fork-upstream (ci#54) AND names the public
    # fetch-policy action. ci#54's pin still called
    # maxi-tools/maxi-config/.github/actions/fetch-policy, which a public
    # repo cannot resolve, so the lane died at job setup. A fork of
    # upstream does not run house-style fmt/clippy against code it rebases
    # onto.
    # checkout_submodules is required: freya-icons' build script reads
    # crates/freya-icons/external/lucide, which is a submodule. Without it
    # lane-test dies in the build script before any test runs.
    uses: maxi-tools/ci/.github/workflows/rust-ci.yml@14f387b4144a783899e91c5f4a2da83b315560bb  # maxi-tools/ci main; sibling path-dep verify-sibling-checkouts (ci#69); target deps + cleanup
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
      pages: write
    with:
      repo_policy: fork-upstream
      checkout_submodules: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
