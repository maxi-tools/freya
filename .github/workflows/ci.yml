# Thin standard Rust CI wrapper for maxi-tools repos.
# Source of truth: maxi-config/workflows/rust-ci.yml
# Copy to .github/workflows/ci.yml in simple Rust repos that can use the
# canonical lane policy without repo-local CI customization.

name: CI

# Cancel superseded PR runs, never main's.
#
# A superseded PR run was testing a stale merge base that gets re-verified once
# main is integrated, so dropping it costs nothing. A push to main is the
# opposite case: `github.ref` is `refs/heads/main` for every merge, so a single
# shared group meant each merge cancelled the previous merge's verification, and
# unlike a PR there is no later re-run — that commit has already shipped.
#
# This does not guarantee every main commit is tested. The group keeps one
# running slot and one pending slot, and a newly queued run evicts whatever was
# pending, so a burst of three or more merges still drops the middle ones. What
# it does stop is a run that has already started being killed outright.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  push:
    branches: [main, release/**]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:

permissions: {}

jobs:
  merge-gate:
    uses: maxi-tools/maxi-config/.github/workflows/rust-ci.yml@main
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
      pages: write
    with:
      repo_policy: standard-rust
    # Named, not inherited. `secrets: inherit` forwards EVERY org secret this
    # repository can see -- this org's are all visibility=all, so that is all of
    # them, model-provider and coverage-service credentials included -- to a
    # workflow that declares exactly two and uses exactly two, to mint a
    # contents:read app token. (Deliberately not enumerated here: which
    # credentials an org holds is itself worth not publishing, and this file is
    # world-readable.)
    #
    # That grant is wrong everywhere, and it is worse here than in the private
    # consumers: this repository is PUBLIC, and the called workflow is moving to
    # a public repository so that a public caller can resolve it at all. After
    # that move, write access to the callee is equivalent to read access to
    # every org secret named above, from here, on every push.
    #
    # Two secrets is what rust-ci.yml declares under `on.workflow_call.secrets`
    # and what its lanes forward to create-github-app-token. Nothing below the
    # call site can reference a secret that is not named here.
    #
    # This matches maxi-config/workflows/standard-rust-ci-wrapper.yml, which is
    # the canonical template and has always had the explicit form. The drift is
    # not local: 35 of 36 consumers carry `inherit` and the template is the
    # outlier, because the fan-out resolves its own source by filesystem
    # enumeration order -- see maxi-config#626. Converging the other 34 is a
    # separate, measured fan-out; this one is done here because it is the only
    # public consumer.
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
