# maxi-config-owned standard Rust CI wrapper.
# Thin standard Rust CI wrapper for maxi-tools repos.
# Source of truth: maxi-config/workflows/standard-rust-ci-wrapper.yml --
# this file, when you are reading it inside maxi-config. Its lane policy
# comes from maxi-config/.github/workflows/rust-ci.yml.
# Copy to .github/workflows/ci.yml in simple Rust repos that can use the
# canonical lane policy without repo-local CI customization.
# Reading a consumer copy? Edit it in maxi-config, not here:
# scripts/sync-maxi-review.sh overwrites this copy on the next fan-out.

name: CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (!contains(fromJSON('["labeled","unlabeled"]'), github.event.action) || contains(fromJSON('["run-ci","run-clippy"]'), github.event.label.name)) }}

on:
  push:
    branches: [main, release/**]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # Run the merge-gate for merge-queue candidates so the required
  # `merge-gate / merge-gate` aggregate reports on queue heads. The reusable's
  # aggregate admits only the `checks_requested` action (the queue-admission
  # hand-shake); the five lifecycle actions mint no required-context run.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: {}

jobs:
  merge-gate:
    # No job-level `if:` here, deliberately -- trust is never a job-level
    # condition (a skipped caller makes every required lane context absent or
    # `skipped`, which an aggregate can read as green). The `merge_group`
    # trigger above subscribes to `checks_requested` only, and every
    # self-hosted job in the reusable chain opens with a `Trust admission`
    # step that fails RED for anything untrusted (fork PRs, merge-queue
    # lifecycle actions, non-owner dispatches) before checkout.
    uses: maxi-tools/ci/.github/workflows/rust-ci.yml@7e019c7131f9e97c606bc423bb12e964eaa5b3e7  # maxi-tools/ci@wt/t_c53018b7-trust-step1 = a51736ac (required toolchain input at the 7e38f4b dtolnay pin) + trust admission as step 1 of every self-hosted job and an aggregate that fails unexplained lane skips (maxi-config#1028 rework, verifier t_e5bf80a3); target deps + cleanup; sign-publish contents:read kept; skip_swift_build forwarded to package per declared input
    permissions:
      contents: write
      pull-requests: read
      actions: read
      id-token: write
      pages: write
    with:
      repo_policy: fork-upstream
      checkout_submodules: true
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
