# Provision (or verify) the Linux system libraries freya links against.
#
# WHY THIS IS NOT `sudo apt-get install` INLINE, WHICH IS WHAT IT REPLACED
# IN FOUR WORKFLOWS.
#
# The Linux lane these jobs run on is `[self-hosted, Linux, ARM64]` -- the
# jasper/pearl/peridot DGX boxes. On 2026-09-08 `sudo apt-get install` worked
# there and every one of these jobs was green. It stopped working when those
# runners were re-enrolled (`peridot` -> `peridot-1`/`peridot-2`, the same
# re-enrolment maxi-config#640 traces the `toolchain-ok` revocation to): the
# new runner service sets NoNewPrivileges, so sudo cannot escalate at all --
#
#   sudo: The "no new privileges" flag is set, which prevents sudo from
#         running as root.
#
# -- and the step died three seconds in, before compiling anything, on every
# push. That is a fleet change, not a freya change, and the org has already
# ruled on how workflows respond to it: maxi-nix's modules/runner-packages.nix
# says "Also left out: sudo. Workflows must not assume it", and maxi-config's
# lane-test.yml carries this same tolerate-then-continue shape for the same
# reason. This action is that rule applied to freya's hand-maintained
# workflows, which predate it.
#
# THE VERIFY STEP IS THE POINT, not a courtesy. Skipping an install that
# cannot run turns a red step into a green one, and a provisioning step that
# reports success by doing nothing is worth less than the failure it replaced.
# So the install is best-effort and the CHECK is mandatory: if the libraries
# are absent the job fails here, naming them and the box, instead of a
# thousand lines later inside a build script as an unresolved `-lgtk-3`.
#
# libxdo is deliberately absent from the verify list even though libxdo-dev is
# installed above: Ubuntu's libxdo-dev ships no pkg-config file, so it cannot
# be probed this way and a name in the list would fail every run.
name: Linux system dependencies
description: Install freya's Linux build dependencies, or verify a preprovisioned image already has them.

runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      shell: bash
      run: |
        set -euo pipefail

        packages="build-essential libssl-dev pkg-config libglib2.0-dev
                  libgtk-3-dev libudev-dev libxdo-dev libwebkit2gtk-4.1-dev"

        if ! command -v apt-get >/dev/null 2>&1; then
          echo "::notice::No apt-get on ${RUNNER_NAME:-this runner}; expecting its image to provide: $packages"
          exit 0
        fi

        elevate=()
        if [ "$(id -u)" -ne 0 ]; then
          # `command -v sudo` is not enough. sudo is INSTALLED on the DGX
          # boxes; it is NoNewPrivileges that stops it working, and that is
          # only visible by trying. `-n` keeps the try non-interactive so a
          # box configured to prompt fails here rather than hanging.
          if ! { command -v sudo >/dev/null 2>&1 && sudo -n true >/dev/null 2>&1; }; then
            echo "::notice::Cannot elevate on ${RUNNER_NAME:-this runner}; expecting its image to provide: $packages"
            exit 0
          fi
          elevate=(sudo)
        fi

        "${elevate[@]}" apt-get update
        # shellcheck disable=SC2086
        "${elevate[@]}" env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $packages

    - name: Verify Linux system dependencies are present
      shell: bash
      run: |
        set -euo pipefail

        required="glib-2.0 gtk+-3.0 webkit2gtk-4.1 javascriptcoregtk-4.1 libudev openssl"

        if ! command -v pkg-config >/dev/null 2>&1; then
          echo "::error::pkg-config is missing on ${RUNNER_NAME:-this runner}; freya's Linux build cannot resolve any system library without it."
          exit 1
        fi

        missing=""
        for module in $required; do
          if pkg-config --exists "$module"; then
            printf '  %-24s %s\n' "$module" "$(pkg-config --modversion "$module")"
          else
            missing="$missing $module"
          fi
        done

        if [ -n "$missing" ]; then
          echo "::error::${RUNNER_NAME:-This runner} is missing system libraries freya links against:$missing -- this box cannot serve freya's Linux lane until its image provides them."
          exit 1
        fi
